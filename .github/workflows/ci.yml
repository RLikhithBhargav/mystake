name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest

      - name: Ruff
        run: ruff check .

  # Single required check for the "Protect main" ruleset.
  ci:
    name: ci
    needs: [web, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require web + api success
        run: |
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.api.result }}" = "success"
